# Free management staging with an expiring PostgreSQL database.
# Review the Blueprint preview in the existing AisleSignals / Staging project.
# No paid resource or automatic deploy is enabled by this file.
previews:
  generation: "off"
projects:
  - name: AisleSignals
    environments:
      - name: Staging
        services:
          - type: web
            name: aislesignals-control-staging
            runtime: python
            plan: free
            region: frankfurt
            repo: https://github.com/g784dwcd2r-crypto/AisleSignals
            branch: codex/cloud-staging
            autoDeployTrigger: "off"
            buildCommand: python scripts/build_control.py
            startCommand: python -m services.cloud.start_with_schema
            # Requires the compatible infrastructure schema; not product readiness.
            healthCheckPath: /health/ready
            maxShutdownDelaySeconds: 15
            envVars:
              - key: PYTHON_VERSION
                value: "3.12.14"
              - key: CLOUD_ENV
                value: staging
              - key: CLOUD_DATABASE_SSLMODE
                value: require
              - key: NODE_VERSION
                value: "24.14.1"
              - key: CLOUD_AUTH_KEY
                sync: false
              - key: CLOUD_BOOTSTRAP_TOKEN
                sync: false
              - key: DATABASE_URL
                fromDatabase:
                  name: aislesignals-postgres-staging
                  property: connectionString
        databases:
          - name: aislesignals-postgres-staging
            databaseName: aislesignals_staging
            plan: free
            region: frankfurt
            postgresMajorVersion: "16"
            ipAllowList: []
            storageAutoscalingEnabled: false
