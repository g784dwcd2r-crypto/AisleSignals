name: Application checks and unsigned desktop bundles

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-vision-runtime:
    name: Pinned Windows model runtime startup
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/local-vision.py setup --runtime-only
      - run: python scripts/smoke_vision_runtime.py

  python:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/cloud/requirements.txt
            services/cloud/requirements-test.txt
      - run: python -m pip install -r services/api/requirements.txt -r services/cloud/requirements-test.txt
      - run: python -m pytest tests packaging -q

  browser:
    name: Build and browser journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run build
      - run: npm run test:web
      - run: npm --prefix apps/web run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: [python, browser, windows-vision-runtime]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r services/api/requirements.txt -r packaging/requirements.txt
      - run: npm ci --prefix apps/web
      - run: npm run build
      - run: python -m PyInstaller --clean --noconfirm packaging/prototype.spec
      - name: Verify actual Windows executable
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/AisleSignalsPrototype/AisleSignalsPrototype.exe
      - name: Verify actual Mac executable
        if: runner.os == 'macOS'
        run: python scripts/smoke_bundle.py dist/AisleSignalsPrototype/AisleSignalsPrototype
      - name: Preserve bundle file permissions inside an archive
        run: python scripts/package_bundle.py --smoke
      - name: Build attended pilot launcher
        run: python -m PyInstaller --clean --noconfirm packaging/pilot.spec
      - name: Verify pilot archive, startup and absence of demo accounts
        run: python scripts/package_bundle.py --bundle-name AisleSignalsPilot --smoke
      - name: Build and verify macOS pilot DMG
        if: runner.os == 'macOS'
        run: python scripts/package_macos_dmg.py --bundle dist/AisleSignalsPilot --output-dir dist --smoke
      - name: Build and verify unsigned macOS production candidate
        if: runner.os == 'macOS'
        run: |
          python scripts/package_macos_dmg.py --bundle dist/AisleSignalsPilot --output-dir dist --smoke --production --cloud-origin https://aislesignals-control-staging.onrender.com
          candidate=$(find dist -maxdepth 1 -name 'AisleSignals-macOS-*-unsigned.dmg' -print -quit)
          python scripts/release_artifact_index.py --artifact "$candidate" --output dist/AisleSignals-macOS-release-index.json --platform Darwin --architecture "$(uname -m)"
      - name: Build unsigned Windows pilot installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $compiler)) { throw 'The pinned GitHub Windows image does not provide Inno Setup 6.' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $source = (Resolve-Path dist/AisleSignalsPilot).Path
          $output = (Resolve-Path dist).Path
          & $compiler "/DMyAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$output" packaging/windows/AisleSignalsPilot.iss
          $setup = Get-Item dist/AisleSignalsPilot-Windows-*-unsigned-pilot-setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "$($setup.FullName).sha256"
      - name: Build unsigned Windows production candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $compiler)) { throw 'The pinned GitHub Windows image does not provide Inno Setup 6.' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $source = (Resolve-Path dist/AisleSignalsPilot).Path
          $output = (Resolve-Path dist).Path
          & $compiler "/DMyAppVersion=$version" "/DSourceDir=$source" "/DOutputDir=$output" packaging/windows/AisleSignalsProduction.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows production candidate compilation failed.' }
          $setup = Get-Item dist/AisleSignals-Windows-*-unsigned.exe
          if ((Get-AuthenticodeSignature $setup).Status -ne 'NotSigned') { throw 'Production candidate was expected to remain unsigned.' }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "$($setup.FullName).sha256"
          python scripts/release_artifact_index.py --artifact $setup.FullName --output dist/AisleSignals-Windows-release-index.json --platform Windows --architecture x86_64
      - name: Smoke-check unsigned Windows pilot install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Item dist/AisleSignalsPilot-Windows-*-unsigned-pilot-setup.exe
          if ((Get-AuthenticodeSignature $setup).Status -ne 'NotSigned') { throw 'Pilot installer signing state was not the expected unsigned state.' }
          $install = Join-Path $env:RUNNER_TEMP 'AisleSignals Pilot install smoke'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$install`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Unsigned pilot install failed with exit code $($process.ExitCode)." }
          & "$install\AisleSignalsPilot.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed pilot executable smoke failed.' }
          & "$install\AisleSignalsPilot.exe" startup enable
          if ($LASTEXITCODE -ne 0) { throw 'Installed pilot could not enable per-user startup.' }
          try {
            $startup = & "$install\AisleSignalsPilot.exe" startup status
            if ($LASTEXITCODE -ne 0 -or $startup.Trim() -ne 'enabled') { throw 'Installed pilot startup status is inconsistent.' }
          } finally {
            & "$install\AisleSignalsPilot.exe" startup disable
            if ($LASTEXITCODE -ne 0) { throw 'Installed pilot could not remove its per-user startup entry.' }
          }
          $uninstall = Get-Item "$install\unins*.exe"
          $process = Start-Process $uninstall.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Unsigned pilot uninstall failed with exit code $($process.ExitCode)." }
      - name: Smoke-check unsigned Windows production candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-Item dist/AisleSignals-Windows-*-unsigned.exe
          $install = Join-Path $env:RUNNER_TEMP 'AisleSignals production candidate smoke'
          $process = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$install`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Production candidate install failed with exit code $($process.ExitCode)." }
          & "$install\AisleSignals.exe" connect --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed production candidate is missing the secure pairing command.' }
          & "$install\AisleSignals.exe" startup enable
          if ($LASTEXITCODE -ne 0) { throw 'Installed production candidate could not enable startup.' }
          try {
            $startup = & "$install\AisleSignals.exe" startup status
            if ($LASTEXITCODE -ne 0 -or $startup.Trim() -ne 'enabled') { throw 'Production candidate startup state is inconsistent.' }
          } finally {
            & "$install\AisleSignals.exe" startup disable
          }
          $uninstall = Get-Item "$install\unins*.exe"
          $process = Start-Process $uninstall.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Production candidate uninstall failed with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v4
        with:
          name: AisleSignalsPrototype-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/AisleSignalsPrototype-*.zip
            dist/AisleSignalsPrototype-*.tar.gz
            dist/AisleSignalsPrototype-*.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AisleSignalsPilot-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/AisleSignalsPilot-*.zip
            dist/AisleSignalsPilot-*.tar.gz
            dist/AisleSignalsPilot-*.dmg
            dist/AisleSignalsPilot-*-unsigned-pilot-setup.exe
            dist/AisleSignalsPilot-*-unsigned-pilot-setup.exe.sha256
            dist/AisleSignalsPilot-*.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AisleSignals-${{ runner.os }}-${{ runner.arch }}-unsigned-production-candidate
          path: |
            dist/AisleSignals-macOS-*-unsigned.dmg
            dist/AisleSignals-macOS-*-unsigned.dmg.sha256
            dist/AisleSignals-macOS-release-index.json
            dist/AisleSignals-Windows-*-unsigned.exe
            dist/AisleSignals-Windows-*-unsigned.exe.sha256
            dist/AisleSignals-Windows-release-index.json
          if-no-files-found: error
          retention-days: 14
