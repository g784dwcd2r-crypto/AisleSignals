name: Prototype checks and desktop bundles

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m pytest tests/api tests/companion tests/evaluation -q

  browser:
    name: Build and browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run build
      - run: npm run test:web
      - run: npm --prefix apps/web run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: [python, browser]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r services/api/requirements.txt -r packaging/requirements.txt
      - run: npm ci --prefix apps/web
      - run: npm run build
      - run: python -m PyInstaller --clean --noconfirm packaging/prototype.spec
      - name: Verify actual Windows executable
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/AisleSignalsPrototype/AisleSignalsPrototype.exe
      - name: Verify actual Mac executable
        if: runner.os == 'macOS'
        run: python scripts/smoke_bundle.py dist/AisleSignalsPrototype/AisleSignalsPrototype
      - name: Preserve bundle file permissions inside an archive
        run: python scripts/package_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: AisleSignalsPrototype-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/AisleSignalsPrototype-*.zip
            dist/AisleSignalsPrototype-*.tar.gz
          retention-days: 14
