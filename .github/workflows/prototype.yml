name: Application checks and unsigned desktop bundles

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-vision-runtime:
    name: Pinned Windows model runtime startup
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/local-vision.py setup --runtime-only
      - run: python scripts/smoke_vision_runtime.py

  python:
    name: Python checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/cloud/requirements.txt
            services/cloud/requirements-test.txt
      - run: python -m pip install -r services/api/requirements.txt -r services/cloud/requirements-test.txt
      - run: python -m pytest tests packaging/test_bundle_integrity.py -q

  browser:
    name: Build and browser journeys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm run build
      - run: npm run test:web
      - run: npm --prefix apps/web run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop bundle (${{ matrix.os }})
    needs: [python, browser, windows-vision-runtime]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r services/api/requirements.txt -r packaging/requirements.txt
      - run: npm ci --prefix apps/web
      - run: npm run build
      - run: python -m PyInstaller --clean --noconfirm packaging/prototype.spec
      - name: Verify actual Windows executable
        if: runner.os == 'Windows'
        run: python scripts/smoke_bundle.py dist/AisleSignalsPrototype/AisleSignalsPrototype.exe
      - name: Verify actual Mac executable
        if: runner.os == 'macOS'
        run: python scripts/smoke_bundle.py dist/AisleSignalsPrototype/AisleSignalsPrototype
      - name: Preserve bundle file permissions inside an archive
        run: python scripts/package_bundle.py --smoke
      - name: Build attended pilot launcher
        run: python -m PyInstaller --clean --noconfirm packaging/pilot.spec
      - name: Verify pilot archive, startup and absence of demo accounts
        run: python scripts/package_bundle.py --bundle-name AisleSignalsPilot --smoke
      - name: Build and verify macOS pilot DMG
        if: runner.os == 'macOS'
        run: python scripts/package_macos_dmg.py --bundle dist/AisleSignalsPilot --output-dir dist --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: AisleSignalsPrototype-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/AisleSignalsPrototype-*.zip
            dist/AisleSignalsPrototype-*.tar.gz
            dist/AisleSignalsPrototype-*.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: AisleSignalsPilot-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/AisleSignalsPilot-*.zip
            dist/AisleSignalsPilot-*.tar.gz
            dist/AisleSignalsPilot-*.dmg
            dist/AisleSignalsPilot-*.sha256
          if-no-files-found: error
          retention-days: 14
