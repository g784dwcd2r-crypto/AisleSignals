name: Production release gate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact full commit SHA at the head of main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release-gate
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact production candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require the exact current main commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/cloud/requirements.txt
            services/cloud/requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/control/package-lock.json
      - run: python -m pip install -r services/api/requirements.txt -r services/cloud/requirements-test.txt
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/control
      - run: npm run build
      - run: npm run test:web
      - run: npm --prefix apps/web run format:check
      - run: npm --prefix apps/control run build
      - run: npm --prefix apps/control test
      - run: npm --prefix apps/control run format:check
      - name: Locate PostgreSQL tools
        run: |
          cloud_postgres_bin="$(pg_config --bindir)"
          test -x "$cloud_postgres_bin/initdb"
          test -x "$cloud_postgres_bin/pg_ctl"
          echo "$cloud_postgres_bin" >> "$GITHUB_PATH"
      - name: Python, cloud and migration checks
        run: python -m pytest tests packaging/test_bundle_integrity.py -q
        env:
          CLOUD_RUN_POSTGRES_TESTS: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test -c control-playwright.config.ts
        env:
          CLOUD_TEST_PYTHON: python
          CONTROL_E2E_PORT: '60644'
      - name: Record immutable non-deployment evidence
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          mkdir -p .local/production-release-evidence
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = [
              Path('.node-version'), Path('package-lock.json'),
              Path('apps/web/package-lock.json'), Path('apps/control/package-lock.json'),
              Path('deployment/render-staging.yaml'), Path('deployment/render-production.yaml'),
              *sorted(Path('services/cloud/migrations').glob('*.sql')),
          ]
          evidence = {
              'schema_version': 1,
              'release_sha': os.environ['RELEASE_SHA'],
              'files': {str(path): hashlib.sha256(path.read_bytes()).hexdigest() for path in paths},
              'deployment_performed': False,
          }
          Path('.local/production-release-evidence/release.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence-${{ inputs.release_sha }}
          path: .local/production-release-evidence/release.json
          retention-days: 30
